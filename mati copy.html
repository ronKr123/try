<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>דף נחיתהי</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<style>
/* עוטף כל העמוד */
.landing-page {
  background-color: #1887ba;
  color: rgba(255,255,255,0.9);
  font-family: "Rubik", sans-serif;
  margin: -8px; /* מבטל את המרווח של הדפדפן */
}

/* CONTAINER */
.landing-page .container {
  background-color: #1887ba;
  background-image: url("https://www.transparenttextures.com/patterns/billie-holiday.png");
  padding: 24px clamp(16px, 5vw, 56px);
}

/* HERO */
.landing-page .hero {
  position: relative;
  overflow: hidden;
}

.landing-page .hero img {
  width: 100%;
  display: block;
}

/* TEXT */
.landing-page .hero-text {
  text-align: right;
  margin: 20px 0;
}

/* כותרת */
.landing-page .hero-text h1 {
  margin: 0;
  color: #fff;
  font-weight: 800;
  font-size: clamp(30px, 5vw, 60px);
  line-height: 1.1;

  max-width: 20ch; /* שובר שורה לפי תווים */
  overflow-wrap: break-word;
}

/* כותרת משנה */
.landing-page .hero-sub {
  margin-top: 10px;
  font-size: clamp(20px, 2vw, 23px);
  line-height: 1.6;

  max-width: 60ch;
  overflow-wrap: break-word;
}

/* SOCIAL */
.landing-page .socials {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}

.landing-page .socials a {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #fff;
  color: #111;
  display: grid;
  place-items: center;
  font-size: 24px;
}

/* 📱 מובייל */
@media (max-width: 768px) {
  .landing-page .hero img {
    height: 50vh;
    object-fit: cover;
  }

  .landing-page .hero-text h1 {
    font-size: clamp(40px, 10vw, 72px);
    max-width: 12ch;
  }

  .landing-page .hero-sub {
    font-size: clamp(20px, 5vw, 28px);
    max-width: 25ch;
  }
}

</style>
</head>

<body>

<div class="landing-page">

  <section class="hero">
    <img src="1d88eebe-8542-4397-a17c-9c44dd50cc1f.png" draggable="false">
  </section>

  <main class="container">
    <div class="hero-text">
      <h1>55 שנה לפסטיבל שירי הילדים</h1>
      <p class="hero-sub">
       דורות גדלו על הקלאסיקות של פסטיבל שירי הילדים, שקשה להאמין שעברו 55 שנה מאז עלה. בתכנית מיוחדת הכוכבים מאז וילדי הפלא החדשים מחדשים את שירי הילדות יחד 🪅
      </p>
    </div>

    <div class="socials">
      <a href="#"><i class="bi bi-youtube"></i></a>
      <a href="#"><i class="bi bi-apple"></i></a>
      <a href="#"><i class="bi bi-spotify"></i></a>
    </div>
  </main>

</div>

</body>
</html>
