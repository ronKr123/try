<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>הדמיית רקע תכלת-לבן — דף הדגמה</title>
  <!--

  -->
  <style>
    :root{
      --blue-1: #e6f5ff; /* very light */
      --blue-2: #cfeaff; /* light */
      --blue-3: #a6daf8; /* mid */
      --accent: #0b7fc1; /* כפתור/קישוט */
      --max-width: 1100px;
    }

    /* Reset קומפקטי */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg,var(--blue-1) 0%, var(--blue-2) 45%, #ffffff 100%);
      color:#07364a;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* מבנה עמוד */
    .page-background{
      min-height:100vh;
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
    }


    /* גל SVG בתחתית לתוספת 'גלים' */
    .wave-svg{
      position:absolute;
      bottom:-2px;
      left:0;
      width:100%;
      height:auto;
      z-index:1;
      pointer-events:none;
      opacity:0.9;
    }

    /* תוכן מעל הרקע */
    .page-content{
      position:relative;
      z-index:2;
      width:100%;
      max-width:var(--max-width);
      display:grid;
      grid-template-columns: 1fr 420px;
      gap:32px;
      align-items:center;
    }


    h1{margin:0 0 10px 0; font-size:28px}
    p.lead{margin:0 0 18px 0; line-height:1.5}

    .btn{
      display:inline-block;
      padding:12px 20px;
      border-radius:10px;
      text-decoration:none;
      font-weight:600;
      background:var(--accent);
      color:white;
      box-shadow:0 6px 18px rgba(11,127,193,0.24);
    }

    /* צד ימין — דמו תמונה (ניתן להחליף בתמונה חיצונית) */
    .hero-visual{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .visual-card{
      width:100%;
      max-width:360px;
      aspect-ratio: 3 / 4;
      border-radius:14px;
      overflow:hidden;
      box-shadow: 0 10px 30px rgba(8,20,30,0.09);
      background: linear-gradient(180deg,var(--blue-3), rgba(255,255,255,0.6));
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Placeholder SVG של ילדה (ווקטור פשוט) */
    .avatar-svg{ width:85%; height:auto; }

    /* כותרת ניווט קטנה */
    nav{position:absolute; top:18px; left:20px; right:20px; z-index:3; display:flex; justify-content:space-between; align-items:center}
    .brand{font-weight:700}
    .nav-actions{display:flex; gap:10px}
    .nav-actions a{font-size:14px; color:rgba(7,54,74,0.85); text-decoration:none}

    /* רספונסיבי */
    @media (max-width:980px){
      .page-content{grid-template-columns:1fr;}
      .visual-card{max-width:300px; margin:0 auto}
    }
    @media (max-width:480px){
      h1{font-size:22px}
      .page-background{padding:20px}
      .page-background::before{height:36vh; top:2%}
    }
  </style>
</head>
<body>
  <div class="page-background">

    <nav>
      <div class="brand">שם הפרויקט</div>
      <div class="nav-actions">
        <a href="#">התחברות</a>
        <a href="#">הרשמה</a>
      </div>
    </nav>

    <main class="page-content" role="main">
      
    </main>

    <!-- גל SVG בתחתית — ניתן לשנות צבעים/גובה -->
    <svg class="wave-svg" viewBox="0 0 1440 150" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,80 C240,140 360,0 720,60 C1080,120 1320,40 1440,80 L1440,150 L0,150 Z" fill="#ffffff" />
    </svg>

  </div>
</body>
</html>
