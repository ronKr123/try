
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עמוד עם לוגו ורקע</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background-image: url('72d77962-92d6-4e39-b371-6f1f86cac9bf.png');
background-size: cover;
    background-repeat: no-repeat;
    background-position: center center;
    background-attachment: fixed;
  }

  header {
    width: 100%;
    display: flex;
    justify-content: flex-end; /* יישור הלוגו לימין */
    align-items: center; /* ממרכז אנכית */
    padding: 10px 20px; /* רווח מסביב ללוגו */
    box-sizing: border-box;
  }

  header img {
    height: 150px; /* גובה הלוגו */
    width: auto; /* יחס צדדים נשמר */
  }

  .center-image {
  display: flex;
  justify-content: center; /* מרכז אופקית */
  align-items: center;     /* מרכז אנכית */
  height: 35vh; /* גובה - אפשר לשנות */
}

.center-image img {
  max-width: 80%; /* שלא תהיה גדולה מדי */
  height: auto;
}

.bottom-image img {
  width: 100%;   /* תופס את כל הרוחב */
  height: auto;  /* שומר על יחס */
  display: block;
}
</style>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="landing-page">
<header>
  <img src="לוגו פסח גלצ.png" alt="לוגו" draggable="false">
</header>

<div class="center-image">
  <img src="Untitled-removebg-preview.png" alt="תמונה מרכזית" draggable="false">
</div>
<section class="songs-slider">
        <div class="card__container swiper">
          <div class="card__content">
            <div class="swiper-wrapper">
              <article class="card__article swiper-slide">
                <div class="card__image">
                  <img src="ילדיסקו.jpg" alt="image" class="card__img">
                </div>
              </article>

              <article class="card__article swiper-slide">
                <div class="card__image">
                  <img src="למה ככה.jpg.jpeg" alt="image" class="card__img">
                </div>
              </article>

              <article class="card__article swiper-slide">
                <div class="card__image">
                  <img src="1.jpeg" alt="image" class="card__img">
                </div>
              </article>

              <article class="card__article swiper-slide">
                <div class="card__image">
                  <img src="2.jpeg" alt="image" class="card__img">
                </div>
              </article>

              <article class="card__article swiper-slide">
                <div class="card__image">
                  <img src="3.jpeg" alt="image" class="card__img">
                </div>
              </article>
            </div>
          </div>

          <div class="swiper-button-next">
            <i class="bi bi-chevron-right"></i>
          </div>

          <div class="swiper-button-prev">
            <i class="bi bi-chevron-left"></i>
          </div>

          <div class="swiper-pagination"></div>
        </div>
      </section>

      <div class="bottom-image">
  <img src="Untitled11-removebg-preview.png" alt="footer image" draggable="false">
      </div>
</div>
      <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>

  <script>
let swiperCards = new Swiper(".card__content", {
  loop: true,
  spaceBetween: 16,
  grabCursor: true,

  autoplay: {
    delay: 3000,
    disableOnInteraction: false,
    pauseOnMouseEnter: true,
  },

  pagination: {
    el: ".swiper-pagination",
    clickable: true,
  },

  navigation: {
    nextEl: ".swiper-button-next",
    prevEl: ".swiper-button-prev",
  },

  breakpoints: {
    0: {
      slidesPerView: 1.15,
      centeredSlides: false, // 🔥 חשוב!
    },
    600: {
      slidesPerView: 2,
      centeredSlides: false,
    },
    968: {
      slidesPerView: 3,
      centeredSlides: false,
    },
  },
});
  </script>

</body>
</html>
