
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עמוד עם לוגו ורקע</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background-image: url('72d77962-92d6-4e39-b371-6f1f86cac9bf.png');
background-size: cover;
    background-repeat: no-repeat;
    background-position: center center;
    background-attachment: fixed;
  }

  header {
    width: 100%;
    display: flex;
    justify-content: flex-end; /* יישור הלוגו לימין */
    align-items: center; /* ממרכז אנכית */
    padding: 10px 20px; /* רווח מסביב ללוגו */
    box-sizing: border-box;
  }

  header img {
    height: 150px; /* גובה הלוגו */
    width: auto; /* יחס צדדים נשמר */
  }

  .center-image {
  display: flex;
  justify-content: center; /* מרכז אופקית */
  align-items: center;     /* מרכז אנכית */
  height: 25vh; /* גובה - אפשר לשנות */
}

.center-image img {
  max-width: 60%; /* שלא תהיה גדולה מדי */
  height: auto;
}

.center-image-2 {
  display: flex;
  justify-content: center; /* מרכז אופקית */
  align-items: center;     /* מרכז אנכית */
  height: 20vh; /* גובה - אפשר לשנות */
}

.center-image-2 img {
  max-width: 30%; /* שלא תהיה גדולה מדי */
  height: auto;
}

.bottom-image img {
  width: 100%;   /* תופס את כל הרוחב */
  height: auto;  /* שומר על יחס */
  display: block;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 15px;
  max-width: 1500px;   /* מקטין את כל הגלריה */
  margin: auto;
}

.card {
  width: 100%;
  aspect-ratio: 694 / 452;
  overflow: hidden;
  border-radius: 12px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* אפקט הגדלה */
.card:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* טאבלט */
@media (max-width: 900px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }

  .center-image img {
  max-width: 100%; /* שלא תהיה גדולה מדי */
  height: auto;
}

header img {
    height: 100%; /* גובה הלוגו */
    width: auto; /* יחס צדדים נשמר */
  }
}

/* מובייל */
@media (max-width: 500px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
  }

  .card {
    max-width: 90%;
    margin: 20px auto;
  }

  .center-image img {
  max-width: 100%; /* שלא תהיה גדולה מדי */
  height: auto;
}

header img {
    height: 100%; /* גובה הלוגו */
    width: auto; /* יחס צדדים נשמר */
  }
}
</style>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

      <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>

  <script>
let swiperCards = new Swiper(".card__content", {
  loop: true,
  spaceBetween: 16,
  grabCursor: true,

  autoplay: {
    delay: 3000,
    disableOnInteraction: false,
    pauseOnMouseEnter: true,
  },

  pagination: {
    el: ".swiper-pagination",
    clickable: true,
  },

  navigation: {
    nextEl: ".swiper-button-next",
    prevEl: ".swiper-button-prev",
  },

  breakpoints: {
    0: {
      slidesPerView: 1.15,
      centeredSlides: false, // 🔥 חשוב!
    },
    600: {

});

</html>
